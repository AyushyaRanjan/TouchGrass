  why: "Small repeated effort is the kind that actually happens."
  minutes: 10
  difficulty: 1
  needs_dry: false
  proof_hint: "Your shoes on the curb or step you used."
  criteria:
    - {id: c1, q: "Are shoes or feet visible?", required: true}
    - {id: c2, q: "Is a curb, step or low platform visible?", required: true}

