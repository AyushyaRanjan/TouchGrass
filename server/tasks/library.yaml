# Touch Grass task library (AGENTS.md rule 6: hand-written, never LLM-generated).
# Style guide: the 12 seed tasks below are the reference. Every task needs:
#   id (unique slug), category, title, why, minutes, difficulty (1-3),
#   proof_hint, needs_dry, comfort (1-3, social only),
#   note_prompt (optional, social tasks), criteria (2-4, at least 2 required).
# Criteria rules: one yes/no question about one concrete visual thing,
# answerable from ONE photo, never a stranger's face, social = place/setting.
# Safety: public places only, no night isolation, no alcohol, no minors,
# nothing costing more than a small snack or drink.

# --- nature (10) ---

- id: nat_leaf_hunt
  category: nature
  title: "Find the most colorful leaf"
  why: "Autumn colors last only a few weeks. Slow down and look closely."
  minutes: 20
  difficulty: 1
  needs_dry: true
  proof_hint: "One leaf held in your hand or lying on the ground, trees behind it."
  criteria:
    - {id: c1, q: "Is a single leaf clearly visible?", required: true}
    - {id: c2, q: "Is the leaf yellow, orange, red or brown?", required: true}
    - {id: c3, q: "Is the photo taken outdoors?", required: true}

- id: nat_sit_under_tree
  category: nature
  title: "Sit under a tree for 5 minutes, phone away"
  why: "Five quiet minutes is enough to notice what you usually walk past."
  minutes: 15
  difficulty: 1
  needs_dry: true
  proof_hint: "Photo looking up into the tree, taken when you leave."
  criteria:
    - {id: c1, q: "Is a tree trunk or tree canopy visible?", required: true}
    - {id: c2, q: "Is the photo taken outdoors?", required: true}
    - {id: c3, q: "Are branches or leaves visible overhead?", required: false}

- id: nat_plant_care
  category: nature
  title: "Look after one plant: water it, prune it, or just check on it"
  why: "Plants reward attention slowly."
  minutes: 10
  difficulty: 1
  needs_dry: false
  proof_hint: "The plant, with soil, pot or garden visible."
  criteria:
    - {id: c1, q: "Is a living plant visible?", required: true}
    - {id: c2, q: "Is soil, a pot or a garden bed visible?", required: true}

- id: nat_cloud_shapes
  category: nature
  title: "Find a cloud shape and photograph it"
  why: "Clouds rearrange themselves within minutes. Look up before they go."
  minutes: 15
  difficulty: 1
  needs_dry: true
  proof_hint: "The cloud, with sky around it."
  criteria:
    - {id: c1, q: "Is a cloud visible in the sky?", required: true}
    - {id: c2, q: "Is the photo taken outdoors?", required: true}
    - {id: c3, q: "Is a good amount of sky visible?", required: false}

- id: nat_flower_closeup
  category: nature
  title: "Photograph one flower up close"
  why: "Flowers are the boldest thing growing within arm's reach."
  minutes: 15
  difficulty: 1
  needs_dry: true
  proof_hint: "One flower filling most of the frame."
  criteria:
    - {id: c1, q: "Is a flower clearly visible?", required: true}
    - {id: c2, q: "Is the photo taken outdoors?", required: true}
    - {id: c3, q: "Are petals or the center of the flower visible?", required: false}

- id: nat_tree_bark
  category: nature
  title: "Touch a tree and photograph its bark up close"
  why: "Every species has its own fingerprint in the bark."
  minutes: 10
  difficulty: 1
  needs_dry: false
  proof_hint: "Bark filling the frame, taken from arm's length."
  criteria:
    - {id: c1, q: "Is tree bark visible up close?", required: true}
    - {id: c2, q: "Is the photo taken outdoors?", required: true}

- id: nat_bird_watch
  category: nature
  title: "Watch one bird for two minutes and photograph it"
  why: "Birds do everything in the open, if you stay still long enough."
  minutes: 15
  difficulty: 2
  needs_dry: true
  proof_hint: "The bird, on the ground, a branch or a wire."
  criteria:
    - {id: c1, q: "Is a bird visible in the photo?", required: true}
    - {id: c2, q: "Is the photo taken outdoors?", required: true}

- id: nat_water_spot
  category: nature
  title: "Find moving water: a stream, a fountain or falling rain"
  why: "Moving water is the easiest calm you can find."
  minutes: 25
  difficulty: 2
  needs_dry: false
  proof_hint: "The water itself, close enough to see movement."
  criteria:
    - {id: c1, q: "Is water visible in the photo?", required: true}
    - {id: c2, q: "Is the photo taken outdoors?", required: true}
    - {id: c3, q: "Does the water look like it is moving or falling?", required: false}

- id: nat_weed_crack
  category: nature
  title: "Photograph a plant growing where it should not be"
  why: "Weeds are the stubbornest gardeners there are."
  minutes: 10
  difficulty: 1
  needs_dry: false
  proof_hint: "The plant in a pavement crack or wall, with the ground around it."
  criteria:
    - {id: c1, q: "Is a small plant growing out of a crack, wall or pavement?", required: true}
    - {id: c2, q: "Is the photo taken outdoors?", required: true}
    - {id: c3, q: "Is paving, concrete or stone visible around it?", required: false}

- id: nat_sunset_sky
  category: nature
  title: "Watch the sky change color for 10 minutes around sunset"
  why: "The best show of the day is free and happens once."
  minutes: 20
  difficulty: 1
  needs_dry: true
  proof_hint: "The sky with sunset colors, taken while there is still light out."
  criteria:
    - {id: c1, q: "Is the sky showing warm colors such as orange, pink or red?", required: true}
    - {id: c2, q: "Is the photo taken outdoors?", required: true}
    - {id: c3, q: "Is the sun low or below the horizon?", required: false}

