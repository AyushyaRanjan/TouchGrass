  minutes: 20
  difficulty: 1
  needs_dry: false
  proof_hint: "The plane in your hand or on the ground after it landed."
  criteria:
    - {id: c1, q: "Is a folded paper plane visible?", required: true}
    - {id: c2, q: "Is the photo taken outdoors?", required: true}

