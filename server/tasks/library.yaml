# --- social (8) ---
# Place/setting criteria only. Never people. Never a stranger's face.

- id: soc_small_hello
  category: social
  title: "Say 'good morning' (or hello) to three people you pass"
  why: "Tiny greetings make a place feel like yours."
  minutes: 20
  difficulty: 1
  comfort: 1
  needs_dry: false
  note_prompt: "How did it feel? One line."
  proof_hint: "A photo of the street or park where you did it. No people needed."
  criteria:
    - {id: c1, q: "Is this a street, path, park or other public outdoor place?", required: true}
    - {id: c2, q: "Is the photo taken outdoors?", required: true}

- id: soc_ask_recommendation
  category: social
  title: "Ask someone for their favorite local food or drink spot, then go"
  why: "Locals know things no app does."
  minutes: 45
  difficulty: 2
  comfort: 2
  needs_dry: false
  note_prompt: "What did they recommend?"
  proof_hint: "Photo of the place or what you ordered."
  criteria:
    - {id: c1, q: "Is food or a drink visible, or is this a cafe, stall or restaurant?", required: true}
    - {id: c2, q: "Is this a public place such as a cafe, stall, market or restaurant?", required: true}

- id: soc_thank_server
  category: social
  title: "Buy a small drink or snack and ask the person serving how their day is going"
  why: "A real question turns a transaction into a moment."
  minutes: 20
  difficulty: 1
  comfort: 1
  needs_dry: false
  note_prompt: "What did they say?"
  proof_hint: "Your drink or snack, with the shop or stall around it."
  criteria:
    - {id: c1, q: "Is a drink or snack visible?", required: true}
    - {id: c2, q: "Does the background look like a shop, cafe, stall or market?", required: true}

- id: soc_cafe_new
  category: social
  title: "Try a cafe or tea shop you have never been to"
  why: "A new table in a new room changes the whole break."
  minutes: 40
  difficulty: 2
  comfort: 2
  needs_dry: false
  note_prompt: "What did you order, and would you go back?"
  proof_hint: "Your drink or snack with the cafe around it. No people needed."
  criteria:
    - {id: c1, q: "Is a drink or food visible?", required: true}
    - {id: c2, q: "Does the background look like a cafe, bakery or tea shop?", required: true}
    - {id: c3, q: "Is a table, counter or window seat visible?", required: false}

- id: soc_market_chat
  category: social
  title: "Ask a market stall worker what is freshest today"
  why: "The person behind the stall knows what is good right now."
  minutes: 30
  difficulty: 2
  comfort: 2
  needs_dry: false
  note_prompt: "What did they say was freshest?"
  proof_hint: "The stall or its produce. No people needed."
  criteria:
    - {id: c1, q: "Is a market stall or produce stand visible?", required: true}
    - {id: c2, q: "Is fresh food, fruit or vegetables visible?", required: true}
    - {id: c3, q: "Is this an open-air or covered market?", required: false}

- id: soc_library_visit
  category: social
  title: "Visit the library and pick up something to read"
  why: "Libraries are the last free shop in most towns."
  minutes: 30
  difficulty: 1
  comfort: 1
  needs_dry: false
  note_prompt: "What did you find?"
  proof_hint: "The book or magazine, with shelves behind it."
  criteria:
    - {id: c1, q: "Are books or shelves visible?", required: true}
    - {id: c2, q: "Does the background look like a library?", required: true}

- id: soc_park_hello
  category: social
  title: "Sit on a park bench for ten minutes and say hi to whoever comes by"
  why: "A bench is the cheapest place to be around other people."
  minutes: 20
  difficulty: 2
  comfort: 2
  needs_dry: false
  note_prompt: "Did anyone say hi back?"
  proof_hint: "The bench or the park around it. No people needed."
  criteria:
    - {id: c1, q: "Is a park bench visible?", required: true}
    - {id: c2, q: "Is the photo taken outdoors?", required: true}
    - {id: c3, q: "Are trees or grass visible?", required: false}

- id: soc_shop_question
  category: social
  title: "Ask the owner of a local shop how long they have been open"
  why: "Every shop has a story the owner is happy to tell."
  minutes: 30
  difficulty: 2
  comfort: 2
  needs_dry: false
  note_prompt: "How long have they been open?"
  proof_hint: "Inside the shop or its window display. No people needed."
  criteria:
    - {id: c1, q: "Does the background look like a shop interior or shop window?", required: true}
    - {id: c2, q: "Are products, shelves or a counter visible?", required: true}

